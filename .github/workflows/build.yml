name: Build SystemUI Plus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: systemuiplus-main-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SystemUI Plus
        uses: actions/checkout@v5

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare installable APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="app/build/outputs/apk/release"
          APK="$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No unsigned/unaligned release APK found."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair               -keystore "$KEYSTORE"               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

          ALIGNED="/tmp/SystemUIPlus-release-aligned.apk"
          SIGNED="$OUTPUT_DIR/app-release.apk"

          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"

          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias androiddebugkey             --out "$SIGNED"             "$ALIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"
          rm -f "$ALIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemUIPlus-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
