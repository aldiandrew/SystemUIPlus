name: Build SystemUI Plus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: systemuiplus-stable-build-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SystemUI Plus
        uses: actions/checkout@v5

      - name: Prepare bundled fonts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/res/font app/src/main/assets/fonts

          curl --fail --location --silent --show-error --retry 3 \
            "https://cdn.jsdelivr.net/fontsource/fonts/plus-jakarta-sans@5.3.0/latin-400-normal.ttf" \
            --output app/src/main/res/font/plus_jakarta_sans_400.ttf

          curl --fail --location --silent --show-error --retry 3 \
            "https://cdn.jsdelivr.net/fontsource/fonts/plus-jakarta-sans@5.3.0/latin-500-normal.ttf" \
            --output app/src/main/res/font/plus_jakarta_sans_500.ttf

          curl --fail --location --silent --show-error --retry 3 \
            "https://cdn.jsdelivr.net/fontsource/fonts/plus-jakarta-sans@5.3.0/latin-600-normal.ttf" \
            --output app/src/main/res/font/plus_jakarta_sans_600.ttf

          curl --fail --location --silent --show-error --retry 3 \
            "https://cdn.jsdelivr.net/fontsource/fonts/plus-jakarta-sans@5.3.0/latin-700-normal.ttf" \
            --output app/src/main/res/font/plus_jakarta_sans_700.ttf

          curl --fail --location --silent --show-error --retry 3 \
            "https://cdn.jsdelivr.net/fontsource/fonts/iosevka@5.3.0/latin-400-normal.ttf" \
            --output app/src/main/res/font/iosevka_400.ttf

          curl --fail --location --silent --show-error --retry 3 \
            "https://cdn.jsdelivr.net/fontsource/fonts/iosevka@5.3.0/latin-500-normal.ttf" \
            --output app/src/main/res/font/iosevka_500.ttf

          curl --fail --location --silent --show-error --retry 3 \
            "https://cdn.jsdelivr.net/fontsource/fonts/iosevka@5.3.0/latin-600-normal.ttf" \
            --output app/src/main/res/font/iosevka_600.ttf

          curl --fail --location --silent --show-error --retry 3 \
            "https://cdn.jsdelivr.net/fontsource/fonts/iosevka@5.3.0/latin-700-normal.ttf" \
            --output app/src/main/res/font/iosevka_700.ttf

          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/tokotype/PlusJakartaSans/master/OFL.txt" \
            --output app/src/main/assets/fonts/PLUS_JAKARTA_SANS_OFL.txt

          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/be5invis/Iosevka/main/LICENSE.md" \
            --output app/src/main/assets/fonts/IOSEVKA_LICENSE.md

          test -s app/src/main/res/font/plus_jakarta_sans_400.ttf
          test -s app/src/main/res/font/plus_jakarta_sans_500.ttf
          test -s app/src/main/res/font/plus_jakarta_sans_600.ttf
          test -s app/src/main/res/font/plus_jakarta_sans_700.ttf
          test -s app/src/main/res/font/iosevka_400.ttf
          test -s app/src/main/res/font/iosevka_500.ttf
          test -s app/src/main/res/font/iosevka_600.ttf
          test -s app/src/main/res/font/iosevka_700.ttf
          test -s app/src/main/assets/fonts/PLUS_JAKARTA_SANS_OFL.txt
          test -s app/src/main/assets/fonts/IOSEVKA_LICENSE.md

          cat > app/src/main/assets/fonts/THIRD_PARTY_NOTICES.txt <<'EOF'
          SystemUI Plus bundled fonts

          Plus Jakarta Sans
          Source: https://github.com/tokotype/PlusJakartaSans
          License: SIL Open Font License 1.1
          License text: PLUS_JAKARTA_SANS_OFL.txt

          Iosevka
          Source: https://github.com/be5invis/Iosevka
          License: SIL Open Font License 1.1
          License text: IOSEVKA_LICENSE.md
          EOF

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare installable APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="app/build/outputs/apk/release"
          APK="$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No unsigned/unaligned release APK found."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair               -keystore "$KEYSTORE"               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

          ALIGNED="/tmp/SystemUIPlus-release-aligned.apk"
          SIGNED="$OUTPUT_DIR/app-release.apk"

          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"

          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias androiddebugkey             --out "$SIGNED"             "$ALIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"
          rm -f "$ALIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemUIPlus-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
