name: Build SystemUI Plus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: systemuiplus-stable-build-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SystemUI Plus
        uses: actions/checkout@v5

      - name: Prepare bundled fonts
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d)"
          JAKARTA_DIR="$TMP_DIR/jakarta"
          IOSEVKA_DIR="$TMP_DIR/iosevka"

          mkdir -p             "$JAKARTA_DIR"             "$IOSEVKA_DIR"             app/src/main/res/font             app/src/main/assets/fonts

          npm pack --silent             @fontsource/plus-jakarta-sans@5.3.0             --pack-destination "$TMP_DIR"

          npm pack --silent             @fontsource/iosevka@5.3.0             --pack-destination "$TMP_DIR"

          JAKARTA_TGZ="$(find "$TMP_DIR" -maxdepth 1 -type f -name 'fontsource-plus-jakarta-sans-5.3.0.tgz' -print -quit)"
          IOSEVKA_TGZ="$(find "$TMP_DIR" -maxdepth 1 -type f -name 'fontsource-iosevka-5.3.0.tgz' -print -quit)"

          tar -xzf "$JAKARTA_TGZ" -C "$JAKARTA_DIR" --strip-components=1
          tar -xzf "$IOSEVKA_TGZ" -C "$IOSEVKA_DIR" --strip-components=1

          for spec in \
            "400|Regular" \
            "500|Medium" \
            "600|SemiBold" \
            "700|Bold"; do

            weight="${spec%%|*}"
            name="${spec#*|}"

            JAKARTA_FONT="$(find "$JAKARTA_DIR" -type f -name "PlusJakartaSans-${name}.ttf" -print -quit)"
            IOSEVKA_FONT="$(find "$IOSEVKA_DIR" -type f -name "Iosevka-${name}.ttf" -print -quit)"

            test -n "$JAKARTA_FONT"
            test -n "$IOSEVKA_FONT"

            cp "$JAKARTA_FONT" "app/src/main/res/font/plus_jakarta_sans_${weight}.ttf"
            cp "$IOSEVKA_FONT" "app/src/main/res/font/iosevka_${weight}.ttf"
          done

          JAKARTA_LICENSE="$(find "$JAKARTA_DIR" -type f -name 'OFL.txt' -print -quit)"
          IOSEVKA_LICENSE="$(find "$IOSEVKA_DIR" -type f -name 'OFL.txt' -print -quit)"

          test -n "$JAKARTA_LICENSE"
          test -n "$IOSEVKA_LICENSE"

          cp "$JAKARTA_LICENSE" app/src/main/assets/fonts/PLUS_JAKARTA_SANS_OFL.txt
          cp "$IOSEVKA_LICENSE" app/src/main/assets/fonts/IOSEVKA_OFL.txt
      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare installable APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="app/build/outputs/apk/release"
          APK="$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No unsigned/unaligned release APK found."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair               -keystore "$KEYSTORE"               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

          ALIGNED="/tmp/SystemUIPlus-release-aligned.apk"
          SIGNED="$OUTPUT_DIR/app-release.apk"

          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"

          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias androiddebugkey             --out "$SIGNED"             "$ALIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"
          rm -f "$ALIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemUIPlus-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
